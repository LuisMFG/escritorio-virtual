<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1b1d24" />
    <meta
      name="description"
      content="Escritório virtual isométrico para conversar com o pessoal."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Escritório Virtual</title>
    <script>
      // Tema e tamanho do texto salvos antes de pintar a página (evita piscar).
      try {
        const t = localStorage.getItem('ev-theme');
        const light =
          t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        if (light) document.documentElement.dataset.theme = 'light';
        const f = localStorage.getItem('ev-font-scale');
        if (f) document.documentElement.style.setProperty('--font-scale', f);
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
