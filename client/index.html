<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b1d24" />
    <meta
      name="description"
      content="Escritório virtual isométrico para conversar com o pessoal."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Escritório Virtual</title>
    <script>
      // Tema salvo antes de pintar a página (evita piscar escuro→claro).
      try {
        if (localStorage.getItem('ev-theme') === 'light')
          document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
