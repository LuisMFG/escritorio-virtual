# Produção com Docker: `docker compose up -d --build`.
#
# As chamadas usam o servidor de mídia (LiveKit, serviço `livekit`): precisa de LIVEKIT_API_KEY e
# LIVEKIT_API_SECRET no .env e das portas 7881/tcp e 7882/udp abertas para a internet.
#
# O app sempre sobe; a porta 2567 fica no próprio computador (127.0.0.1) — mude APP_BIND para
# 0.0.0.0 no .env para abrir na rede local. Para a internet, escolha UM perfil em
# COMPOSE_PROFILES no .env:
#   caddy         VPS com IP público (Oracle, Hetzner…): HTTPS automático para o DOMAIN.
#   tunel-rapido  PC de casa sem abrir portas: Cloudflare Tunnel grátis, sem conta; o endereço
#                 https://….trycloudflare.com muda a cada vez que o túnel reinicia.
#   tunel         Cloudflare Tunnel fixo (precisa de conta e domínio na Cloudflare e do
#                 TUNNEL_TOKEN no .env).

# Logs de cada contêiner: até 3 arquivos de 10 MB (sem isso crescem até encher o disco).
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  escritorio:
    build: .
    image: escritorio-virtual
    restart: unless-stopped
    logging: *logging
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-2567}:2567'

  livekit:
    image: livekit/livekit-server:v1.13.9
    restart: unless-stopped
    logging: *logging
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881'
      - '7882:7882/udp'

  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - escritorio
      - livekit
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: '${DOMAIN:-localhost}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  tunel-rapido:
    image: cloudflare/cloudflared:2024.12.2
    profiles: [tunel-rapido]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - escritorio
    command: tunnel --no-autoupdate --url http://escritorio:2567

  tunel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: [tunel]
    restart: unless-stopped
    logging: *logging
    depends_on:
      - escritorio
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: '${TUNNEL_TOKEN:-}'

volumes:
  caddy_data:
  caddy_config:
